
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>THARO RACING 3D V5</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:20px;left:20px;pointer-events:none}
#speed{font-size:44px;font-weight:bold}
#controls{position:absolute;bottom:25px;left:15px;right:15px;display:flex;justify-content:space-between}
button{background:#161616bb;color:white;border:1px solid #ffffff66;border-radius:16px;padding:20px;font-size:22px;touch-action:none}
#start{position:absolute;inset:0;background:#07101bdc;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#start h1{font-size:40px;font-style:italic}
#start button{background:#e53935}
#hud{z-index:2;min-width:165px} #controls,#start{z-index:3} #start{background:linear-gradient(135deg,#080b13ee,#321b23dd)} #start h1{font-size:clamp(32px,7vw,76px);letter-spacing:3px;margin:12px} #raceinfo{margin-top:10px;font-size:14px;line-height:1.6} #progress{height:5px;background:#ffffff33;border-radius:5px;margin-top:8px} #progress i{display:block;height:100%;background:#ff493b;width:0%} #countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:90px;font-weight:900;pointer-events:none;z-index:4;text-shadow:0 4px 20px #000} @media(max-width:600px){button{padding:13px;font-size:16px} #hud{top:10px;left:10px} #controls{bottom:12px}}
</style>
</head>
<body>
<div id="hud">
<b>THARO RACING 3D</b>
<div id="speed">0</div> KM/H
<div id="score">Distance: 0 m</div>
<div id="boost">NITRO: 100%</div><div id="raceinfo">POSITION: 1 / 4</div><div id="progress"><i></i></div>
</div>
<div id="controls">
<div><button id="left">◀</button> <button id="right">▶</button></div>
<div><button id="nitro">N₂O</button> <button id="brake">BRAKE</button> <button id="gas">▲</button></div>
</div>
<div id="countdown"></div><div id="start">
<h1>THARO RACING</h1>
<p>HIGHWAY 3D — PERFORMANCE EDITION · 2 KM RACE</p>
<button onclick="startGame()">START RACING</button>
<p>WASD / Arrow Keys / Space for Nitro</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bbcd4);
scene.fog=new THREE.Fog(0x9bbcd4,80,550);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
function fullHD(){
 const ratio=Math.sqrt((1920*1080)/(innerWidth*innerHeight));
 renderer.setPixelRatio(ratio);
 renderer.setSize(innerWidth,innerHeight);
}
fullHD();
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x555555,1.7));
const sun=new THREE.DirectionalLight(0xffe4bd,2);
sun.position.set(-30,50,20);
scene.add(sun);

function box(w,h,d,color,x,y,z,parent=scene){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
 new THREE.MeshStandardMaterial({color,roughness:.4}));
 o.position.set(x,y,z);
 parent.add(o);
 return o;
}

box(200,.2,1600,0x65784a,0,-.2,-400);
box(16,.1,1600,0x303238,0,0,-400);

const markings=[];
for(let i=0;i<100;i++){
 for(const x of [-4,0,4]){
 markings.push(box(.12,.03,5,0xffffff,x,.08,-i*12));
 }
}
for(const x of [-8,8]){
 box(.18,.05,1600,0xffffff,x,.08,-400);
}

const buildings=[];
for(let i=0;i<70;i++){
 for(const side of [-1,1]){
 const h=5+Math.random()*25;
 buildings.push(box(8,h,10,0x697781,side*(15+Math.random()*15),h/2,-i*18));
 }
}

function makeCar(color){
 const g=new THREE.Group();
 box(2,.55,4.5,color,0,.65,0,g);
 box(1.85,.45,1.9,0x17232e,0,1.12,.15,g);
 box(1.65,.13,1.5,color,0,1.4,.15,g);
 box(2,.15,.45,color,0,.93,1.7,g);
 for(const x of [-.72,.72]){
 box(.48,.17,.08,0xff1809,x,.7,2.28,g);
 box(.12,.32,.15,color,x,1.03,1.8,g);
 }
 box(2.05,.12,.38,color,0,1.25,1.8,g);
 for(const x of [-1,1]){
 for(const z of [-1.4,1.4]){
 const wheel=new THREE.Mesh(
 new THREE.CylinderGeometry(.43,.43,.32,24),
 new THREE.MeshStandardMaterial({color:0x111111}));
 wheel.rotation.z=Math.PI/2;
 wheel.position.set(x,.45,z);
 g.add(wheel);
 const rim=new THREE.Mesh(
 new THREE.CylinderGeometry(.25,.25,.34,16),
 new THREE.MeshStandardMaterial({color:0xaaaaaa,metalness:.8}));
 rim.rotation.z=Math.PI/2;
 rim.position.copy(wheel.position);
 g.add(rim);
 }}
 scene.add(g);
 return g;
}

const car=makeCar(0x08090b);
const traffic=[];
for(let i=0;i<13;i++){
 const t=makeCar([0xbb2222,0xaaaaaa,0x1646aa,0xffffff][i%4]);
 t.position.set([-6,-2,2,6][i%4],0,-45-i*33);
 traffic.push(t);
}

let speed=0,distance=0,nitro=100,running=false;
const keys={};
let audio,engine,volume,engine2,filter,boostGain,boostOsc;
let countdown=0,elapsed=0,finished=false,playerPlace=4; const raceLength=2000;
const rivals=[0,1,2].map((i)=>({mesh:traffic[i],distance:5+i*5,velocity:47+i*4,lane:[-6,2,6][i],finish:null}));
function beep(freq,duration=.18){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}
function endRace(title){running=false;finished=true;document.querySelector('#start h1').textContent=title;document.querySelector('#start p').textContent='Position '+playerPlace+' / 4 · '+Math.floor(distance)+' m · '+elapsed.toFixed(1)+' s';document.querySelector('#start button').textContent='RACE AGAIN';document.getElementById('start').style.display='flex';beep(title==='CRASH!'?80:650,.4);}

function startGame(){
 document.getElementById('start').style.display='none';
 running=true;
 speed=0;distance=0;nitro=100;elapsed=0;finished=false;countdown=3;playerPlace=4; rivals.forEach((r,i)=>{r.distance=5+i*5;r.finish=null;r.mesh.position.set(r.lane,0,-r.distance);}); document.getElementById('countdown').style.display='flex';
 car.position.x=0;
 traffic.forEach((t,i)=>{if(i>=3)t.position.z=-45-i*33;});
 if(!audio){
 try{
 audio=new (window.AudioContext||window.webkitAudioContext)();
 engine=audio.createOscillator();
 volume=audio.createGain();
 engine.type='sawtooth'; engine2=audio.createOscillator();engine2.type='triangle';filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=220;filter.Q.value=1.1;volume.gain.value=.001;engine.connect(filter);engine2.connect(filter);filter.connect(volume);engine2.start();boostOsc=audio.createOscillator();boostOsc.type='triangle';boostOsc.frequency.value=130;boostGain=audio.createGain();boostGain.gain.value=0;boostOsc.connect(boostGain);boostGain.connect(audio.destination);boostOsc.start();
 volume.connect(audio.destination);
 engine.start();
 }catch(e){}
 }
 if(audio)audio.resume();
}

addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

for(const [id,key] of Object.entries({
 left:'ArrowLeft',right:'ArrowRight',gas:'ArrowUp',
 brake:'ArrowDown',nitro:'Space'
})){
 const b=document.getElementById(id);
 b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[key]=true};
 b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[key]=false;
}

let clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(running && countdown>0){const prev=Math.ceil(countdown);countdown=Math.max(0,countdown-dt);document.getElementById('countdown').textContent=countdown>0?Math.ceil(countdown):'GO!';if(Math.ceil(countdown)!==prev)beep(countdown>0?440:880);if(countdown===0)setTimeout(()=>{if(countdown===0)document.getElementById('countdown').style.display='none'},500);}
 if(running && countdown===0){elapsed+=dt;
 const boost=keys.Space&&nitro>0;
 if(keys.ArrowUp||keys.KeyW||boost)speed+=65*dt;
 else speed-=8*dt;
 if(keys.ArrowDown||keys.KeyS)speed-=120*dt;
 speed=Math.max(0,Math.min(boost?300:220,speed));
 nitro=Math.max(0,Math.min(100,nitro+(boost?-22:5)*dt));
 let steer=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
 car.position.x+=steer*dt*(speed>1?1.8+speed*.023:0);
 car.position.x=Math.max(-6.8,Math.min(6.8,car.position.x));
 car.rotation.z+=(-steer*.045-car.rotation.z)*Math.min(1,dt*8);
 car.rotation.y+=(-steer*.08-car.rotation.y)*Math.min(1,dt*8);
 const move=speed/3.6*dt;
 distance+=move; asphalt.offset.y-=move/4; scenery.forEach(m=>{m.position.z+=move;if(m.position.z>35)m.position.z-=720}); finishGate.position.z=distance-raceLength;
 rivals.forEach((r,i)=>{if(r.finish===null){r.distance+=Math.max(0,r.velocity+Math.sin(elapsed*.7+i)*4)*dt;if(r.distance>=raceLength)r.finish=elapsed;}r.mesh.position.z=distance-r.distance;});playerPlace=1+rivals.filter(r=>r.finish!==null||r.distance>distance).length;
 document.getElementById('raceinfo').textContent='POSITION: '+playerPlace+' / 4 · '+elapsed.toFixed(1)+'s';document.querySelector('#progress i').style.width=Math.min(100,distance/raceLength*100)+'%';
 markings.forEach(m=>{m.position.z+=move;if(m.position.z>30)m.position.z-=1200});
 buildings.forEach(m=>{m.position.z+=move;if(m.position.z>50)m.position.z-=1260});
 traffic.forEach((t,i)=>{
 if(i<3)return; if(!running)return; t.position.z+=(speed/3.6-12-i%5)*dt;
 if(t.position.z>30){
 t.position.z=-400-Math.random()*120;
 t.position.x=[-6,-2,2,6][Math.floor(Math.random()*4)];
 }
 if(t.position.z<-650)t.position.z=-400;
 if(Math.abs(t.position.x-car.position.x)<1.8&&Math.abs(t.position.z)<3.8){
 speed=0;endRace('CRASH!');
 }
 });
 if(running&&distance>=raceLength)endRace(playerPlace===1?'VICTORY!':'RACE COMPLETE');
 document.getElementById('speed').textContent=Math.round(speed);
 document.getElementById('score').textContent='Distance: '+Math.floor(distance)+' m';
 document.getElementById('boost').textContent='NITRO: '+Math.floor(nitro)+'%';
 }
 if(engine){const rpm=35+(speed%55)*1.7+speed*.18;engine.frequency.setTargetAtTime(rpm,audio.currentTime,.08);engine2.frequency.setTargetAtTime(rpm*.5,audio.currentTime,.08);filter.frequency.setTargetAtTime(110+speed*4,audio.currentTime,.1);volume.gain.setTargetAtTime(running?.045+((keys.ArrowUp||keys.KeyW) ? .045 : 0):.001,audio.currentTime,.1);boostGain.gain.setTargetAtTime(running&&keys.Space&&nitro>0?.025:0,audio.currentTime,.1);}
 camera.position.x+=(car.position.x-camera.position.x)*.07;
 camera.position.y=4.6;
 camera.position.z=8.5;
 camera.lookAt(car.position.x*.8,.8,-10);
 renderer.render(scene,camera);
}
// Animation starts after assets and scenery are initialized.
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 fullHD();
});

renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

sun.intensity = 1.5;

function roadTexture(){
 const c = document.createElement('canvas');
 c.width = c.height = 1024;
 const ctx = c.getContext('2d');
 ctx.fillStyle = '#34363a';
 ctx.fillRect(0,0,1024,1024);
 for(let i=0;i<180000;i++){
 const v = 35 + Math.floor(Math.random()*65);
 ctx.fillStyle = `rgb(${v},${v},${v})`;
 ctx.fillRect(Math.random()*1024,Math.random()*1024,2,2);
 }
 const t = new THREE.CanvasTexture(c);
 t.wrapS = t.wrapT = THREE.RepeatWrapping;
 t.repeat.set(4,400);
 t.encoding = THREE.sRGBEncoding;
 t.anisotropy = Math.min(16,renderer.capabilities.getMaxAnisotropy());
 return t;
}

const asphalt = roadTexture();

scene.traverse(o=>{
 if(o.isMesh && o.geometry.type === 'BoxGeometry'){
 const p = o.geometry.parameters;
 if(p.width===16 && p.depth===1600){
 o.material.map = asphalt;
 o.material.color.set(0xffffff);
 o.material.roughness = 1;
 o.material.needsUpdate = true;
 }
 }
});

function windowTexture(){
 const c = document.createElement('canvas');
 c.width = 256;
 c.height = 512;
 const ctx = c.getContext('2d');
 ctx.fillStyle = '#626c76';
 ctx.fillRect(0,0,256,512);
 for(let y=8;y<512;y+=32){
 for(let x=8;x<256;x+=32){
 ctx.fillStyle = Math.random()>.85 ? '#dec795' : '#263d50';
 ctx.fillRect(x,y,23,24);
 }}
 const t = new THREE.CanvasTexture(c);
 t.encoding = THREE.sRGBEncoding;
 t.anisotropy = Math.min(16,renderer.capabilities.getMaxAnisotropy());
 return t;
}

const windows = windowTexture();
buildings.forEach(b=>{
 b.material.map = windows;
 b.material.color.set(0xffffff);
 b.material.needsUpdate = true;
});

car.traverse(o=>{
 if(o.isMesh){
 o.material.roughness = .28;
 }
});

document.getElementById('hud').style.cssText +=
';background:#101820bb;padding:18px;border-radius:18px;border-left:4px solid #ff3030';

document.getElementById('speed').style.cssText =
'font-size:58px;font-style:italic;color:#ffffff;font-weight:900';

// THARO RACING V4 - CAR UPGRADE
document.title = 'THARO RACING 3D V5';

while(car.children.length){
 car.remove(car.children[0]);
}

const paint = new THREE.MeshPhysicalMaterial({
 color:0x080a10,
 metalness:0.65,
 roughness:0.23,
 clearcoat:1,
 clearcoatRoughness:0.1
});

function carPart(geometry,material,x,y,z){
 const mesh=new THREE.Mesh(geometry,material);
 mesh.position.set(x,y,z);
 car.add(mesh);
 return mesh;
}

function curvedPart(w,h,d,x,y,z,material){
 const mesh=carPart(
 new THREE.SphereGeometry(1,32,20),
 material,x,y,z);
 mesh.scale.set(w/2,h/2,d/2);
 return mesh;
}

const glass=new THREE.MeshStandardMaterial({
 color:0x132536,
 metalness:0.4,
 roughness:0.12
});

const rubber=new THREE.MeshStandardMaterial({
 color:0x090909,roughness:0.95
});

const chrome=new THREE.MeshStandardMaterial({
 color:0xbfc5cc,
 metalness:0.8,roughness:0.25
});

// Curved sports car body
curvedPart(2.08,0.82,4.65,0,0.65,0,paint);
curvedPart(1.95,0.55,1.85,0,0.88,-1.1,paint);
curvedPart(1.96,0.65,1.55,0,0.83,1.35,paint);
curvedPart(1.65,0.87,2.05,0,1.05,0,glass);
curvedPart(1.46,0.25,1.35,0,1.48,-0.1,paint);

// Wheels and alloy rims
for(const side of [-1,1]){
 for(const z of [-1.38,1.38]){
 const tyre=carPart(
 new THREE.CylinderGeometry(.43,.43,.36,40),
 rubber,side*.96,.44,z);
 tyre.rotation.z=Math.PI/2;

 const rim=carPart(
 new THREE.CylinderGeometry(.28,.28,.04,32),
 chrome,side*1.155,.44,z);
 rim.rotation.z=Math.PI/2;

 for(let i=0;i<6;i++){
 const a=i*Math.PI/3;
 const spoke=carPart(
 new THREE.BoxGeometry(.045,.24,.045),
 rubber,side*1.18,
 .44+Math.cos(a)*.14,
 z+Math.sin(a)*.14);
 spoke.rotation.x=a;
 }
 }
}

// Rear bumper
const bumper=box(1.76,.36,.25,0x101014,
0,.57,2.01,car);
bumper.material=paint;

// Four round red tail lights
const redLight=new THREE.MeshStandardMaterial({
 color:0xff0808,
 emissive:0xff0000,
 emissiveIntensity:1.8
});

for(const x of [-.72,-.43,.43,.72]){
 const light=carPart(
 new THREE.CylinderGeometry(.125,.125,.07,32),
 redLight,x,.79,2.14);
 light.rotation.x=Math.PI/2;
}

// Rear spoiler
for(const x of [-.68,.68]){
 box(.12,.38,.18,0x080808,x,1.15,1.65,car);
}
box(1.98,.10,.48,0x080808,0,1.38,1.65,car);

// Side mirrors
for(const x of [-1,1]){
 curvedPart(.35,.17,.28,x,.99,-.63,paint);
}

// Dual exhausts
for(const x of [-.65,.65]){
 const pipe=carPart(
 new THREE.CylinderGeometry(.105,.105,.25,24),
 chrome,x,.39,2.02);
 pipe.rotation.x=Math.PI/2;
}

// THARO number plate
const plateCanvas=document.createElement('canvas');
plateCanvas.width=256;
plateCanvas.height=64;
const pc=plateCanvas.getContext('2d');
pc.fillStyle='#eeeeee';
pc.fillRect(0,0,256,64);
pc.fillStyle='#111111';
pc.font='bold 42px Arial';
pc.textAlign='center';
pc.fillText('THARO',128,47);

carPart(new THREE.PlaneGeometry(.52,.13),
new THREE.MeshBasicMaterial({
 map:new THREE.CanvasTexture(plateCanvas)
}),0,.61,2.16);

// Soft shadow underneath the car
const shadowCanvas=document.createElement('canvas');
shadowCanvas.width=shadowCanvas.height=128;
const sc=shadowCanvas.getContext('2d');
const gradient=sc.createRadialGradient(
64,64,5,64,64,64);
gradient.addColorStop(0,'rgba(0,0,0,0.85)');
gradient.addColorStop(1,'rgba(0,0,0,0)');
sc.fillStyle=gradient;
sc.fillRect(0,0,128,128);

const carShadow=carPart(
new THREE.PlaneGeometry(3.1,5.7),
new THREE.MeshBasicMaterial({
 map:new THREE.CanvasTexture(shadowCanvas),
 transparent:true,
 depthWrite:false
}),0,.09,0);

carShadow.rotation.x=-Math.PI/2;
const loader = new THREE.GLTFLoader();

loader.load('./drag-coupe.glb', function(gltf) {
    const model = gltf.scene;

    model.rotation.y = Math.PI;
    model.scale.setScalar(0.85);

    car.children.slice().forEach(function(child) {
        if (child !== carShadow) {
            child.visible = false;
        }
    });

    car.add(model);

    console.log('Black car loaded');
}, undefined, function(error) {
    console.error("Black car model failed to load",error);
 document.getElementById("score").textContent="Car model unavailable";
});

scene.background=new THREE.Color(0xc28e83);scene.fog=new THREE.FogExp2(0xc28e83,.006);sun.color.set(0xffbb83);sun.position.set(-55,22,-60);
const scenery=[];const poleMat=new THREE.MeshStandardMaterial({color:0x34373b});const leafMat=new THREE.MeshStandardMaterial({color:0x344f36});const trunkMat=new THREE.MeshStandardMaterial({color:0x59402d});const lampMat=new THREE.MeshBasicMaterial({color:0xffe1a0});
function part(g,geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);return m;}
for(let i=0;i<30;i++){for(const side of [-1,1]){const g=new THREE.Group();g.position.set(side*9.6,0,-i*24);scene.add(g);scenery.push(g);part(g,new THREE.CylinderGeometry(.065,.10,5.5,8),poleMat,0,2.75,0);part(g,new THREE.BoxGeometry(1.2,.09,.12),poleMat,-side*.55,5.5,0);part(g,new THREE.BoxGeometry(.65,.10,.31),lampMat,-side*1.1,5.42,0);const t=new THREE.Group();t.position.set(side*12,0,-i*24-12);scene.add(t);scenery.push(t);part(t,new THREE.CylinderGeometry(.13,.23,2.1,7),trunkMat,0,1.05,0);part(t,new THREE.IcosahedronGeometry(1.35,1),leafMat,0,2.8,0);}}
for(const side of [-1,1]){box(2.6,.18,1600,0x65626a,side*9.4,.04,-400);box(.18,.28,1600,0xb9b4ac,side*8.1,.12,-400);}
buildings.forEach((b,i)=>{b.material.color.set([0xb6b2b7,0xa9bbc6,0x969096,0xc5b4a8][i%4]);b.scale.x=.7+(i%5)*.16;});
const finishGate=new THREE.Group();scene.add(finishGate);for(const x of [-8.5,8.5])box(.35,6,.35,0x27272c,x,3,0,finishGate);box(17,.85,.3,0x22252b,0,6,0,finishGate);for(let i=0;i<24;i++)for(let j=0;j<2;j++)box(.65,.35,.02,(i+j)%2?0xffffff:0x111111,-7.5+i*.65,5.8+j*.35,.17,finishGate);finishGate.position.z=-raceLength;
// Keep downloaded car model and fallback, as in original.
animate();
</script>
</body>
</html>
